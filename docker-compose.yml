services:
  db:
    image: mirror.gcr.io/library/postgres:16
    container_name: nexus-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "5433:5432"
    volumes:
      - nexus-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: nexus-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@db:5432/nexus?sslmode=disable
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  nexus-pg-data:

# Version updates. Security alerts — в Settings GitHub, не здесь.
# ecosystem `npm` = Node (npm/yarn/pnpm); lockfile у нас pnpm.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
